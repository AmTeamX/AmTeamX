name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements-ci.txt
      - run: python scripts/fetch_contributions.py
      - run: python scripts/fetch_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # free, avoids API rate limits
      - run: python scripts/render_heatmap_svg.py
      - run: python scripts/make_showcase.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: >-
            data/contributions.json data/profile.json data/ascii-portrait.json
            contrib-heatmap.svg hero.svg system-scan.svg projects.svg stack.svg
